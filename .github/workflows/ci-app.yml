name: CI / App

on:
  workflow_call:

jobs:
  tests:
    name: App Test (${{ matrix.module_name }}/${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            module_name: app-shared
            os: ubuntu-latest
            timeout: 10
            task: :app:shared:jvmTest
          - platform: android
            module_name: android-app
            os: ubuntu-latest
            timeout: 20
            task: :app:androidApp:assembleDebug
            needs_android: true
          # Android host tests remain disabled until the published lucene-kmp Android AAR
          # no longer exposes Java 24 bytecode to Java 21 Android host tests.
          - platform: ios
            module_name: app-shared
            os: macos-latest
            timeout: 20
            task: :app:shared:iosSimulatorArm64Test
            needs_konan_cache: true
            needs_xcode: true
            xcode_version: '26'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Set up Android SDK
        if: ${{ matrix.needs_android }}
        uses: android-actions/setup-android@v4

      - name: Setup Xcode
        if: ${{ matrix.needs_xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Konan Cache
        id: konan-cache-restore
        if: ${{ matrix.needs_konan_cache }}
        uses: actions/cache/restore@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run task
        run: ./gradlew ${{ matrix.task }}

      - name: Build Summary
        if: always()
        run: |
          echo "### App ${{ matrix.module_name }} / ${{ matrix.platform }} Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "* Workflow: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "* Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "* Triggered by: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "* Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY

  android-release-smoke:
    name: Android release smoke (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [webus, jc, webus-jc, western, east-asia, sea, south-asia]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build smoke APK
        run: ./gradlew :app:androidApp:assembleRelease "-Pbbl.app.edition=${{ matrix.edition }}"

      - name: Stage smoke APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-smoke
          source_apk="$(find app/androidApp/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -f "$source_apk"
          cp "$source_apk" "dist/android-smoke/bbl-app-${{ matrix.edition }}.apk"

      - name: Verify smoke APK pack contents
        shell: bash
        run: |
          set -euo pipefail
          apk="dist/android-smoke/bbl-app-${{ matrix.edition }}.apk"
          unzip -l "$apk" | grep 'files/bblpacks/' > "$RUNNER_TEMP/apk-files.txt"
          case "${{ matrix.edition }}" in
            webus)
              grep 'files/bblpacks/webus/' "$RUNNER_TEMP/apk-files.txt"
              ! grep 'files/bblpacks/jc/' "$RUNNER_TEMP/apk-files.txt"
              ;;
            webus-jc)
              grep 'files/bblpacks/webus/' "$RUNNER_TEMP/apk-files.txt"
              grep 'files/bblpacks/jc/' "$RUNNER_TEMP/apk-files.txt"
              ! grep 'files/bblpacks/krv/' "$RUNNER_TEMP/apk-files.txt"
              ;;
            east-asia)
              for code in webus kjv cunp krv jc; do grep "files/bblpacks/$code/" "$RUNNER_TEMP/apk-files.txt"; done
              ! grep 'files/bblpacks/lsg/' "$RUNNER_TEMP/apk-files.txt"
              ! grep 'files/bblpacks/irvhin/' "$RUNNER_TEMP/apk-files.txt"
              ;;
          esac
