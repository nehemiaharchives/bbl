name: CI / Core

on:
  workflow_call:

jobs:
  tests:
    name: Core Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            os: ubuntu-latest
            timeout: 10
            task: :core:jvmTest
          - platform: linux-x64
            os: ubuntu-latest
            timeout: 30
            task: :core:linuxX64Test
            needs_konan_cache: true
            saves_konan_cache: true
          - platform: macos
            os: macos-latest
            timeout: 40
            task: :core:macosArm64Test
            needs_konan_cache: true
            saves_konan_cache: true
            needs_xcode: true
            xcode_version: '26'
          - platform: ios
            os: macos-latest
            timeout: 40
            task: :core:iosSimulatorArm64Test
            needs_konan_cache: true
            needs_xcode: true
            xcode_version: '26'
          - platform: mingw
            os: windows-latest
            timeout: 45
            task: :core:mingwX64Test
            needs_konan_cache: true
            saves_konan_cache: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Setup Xcode
        if: ${{ matrix.needs_xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Konan Cache
        id: konan-cache-restore
        if: ${{ matrix.needs_konan_cache }}
        uses: actions/cache/restore@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run task
        run: ./gradlew ${{ matrix.task }}

      - name: Save Konan Cache
        if: ${{ matrix.saves_konan_cache && steps.konan-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache-restore.outputs.cache-primary-key }}

      - name: Build Summary
        if: always()
        run: |
          echo "### Core ${{ matrix.platform }} Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "* Workflow: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "* Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "* Triggered by: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "* Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
