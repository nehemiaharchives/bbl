name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changed.outputs.core }}
      cli: ${{ steps.changed.outputs.cli }}
      app: ${{ steps.changed.outputs.app }}
      global: ${{ steps.changed.outputs.global }}
      docs_only: ${{ steps.changed.outputs.docs_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          head="$HEAD_SHA"

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="${head}^"
          fi

          if ! git diff --name-only "$base" "$head" > changed-files.txt; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
          fi

          echo 'Changed files:'
          cat changed-files.txt

          core=false
          cli=false
          app=false
          global=false
          docs_only=true

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              *.md|docs/**)
                ;;
              core/**)
                core=true
                docs_only=false
                ;;
              cli/**|bbl_install/**)
                cli=true
                docs_only=false
                ;;
              app/**)
                app=true
                docs_only=false
                ;;
              test-framework/**|files/**|gradle/**|.github/workflows/**|*.gradle.kts|settings.gradle.kts|gradle.properties|gradlew|gradlew.bat|Gemfile|Gemfile.lock)
                global=true
                docs_only=false
                ;;
              *)
                global=true
                docs_only=false
                ;;
            esac
          done < changed-files.txt

          {
            echo "core=$core"
            echo "cli=$cli"
            echo "app=$app"
            echo "global=$global"
            echo "docs_only=$docs_only"
          } >> "$GITHUB_OUTPUT"

  core:
    name: Core CI
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.global == 'true'
    uses: ./.github/workflows/ci-core.yml

  cli:
    name: CLI CI
    needs: [changes, core]
    if: |
      always() &&
      !cancelled() &&
      (
        needs.changes.outputs.cli == 'true' ||
        needs.changes.outputs.core == 'true' ||
        needs.changes.outputs.global == 'true'
      ) &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    uses: ./.github/workflows/ci-cli.yml

  app:
    name: App CI
    needs: [changes, core]
    if: |
      always() &&
      !cancelled() &&
      (
        needs.changes.outputs.app == 'true' ||
        needs.changes.outputs.core == 'true' ||
        needs.changes.outputs.global == 'true'
      ) &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    uses: ./.github/workflows/ci-app.yml

  gate:
    name: CI Gate
    needs: [changes, core, cli, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize selected CI
        shell: bash
        run: |
          {
            echo '### CI routing summary'
            echo '* core changed: `${{ needs.changes.outputs.core }}`'
            echo '* cli changed: `${{ needs.changes.outputs.cli }}`'
            echo '* app changed: `${{ needs.changes.outputs.app }}`'
            echo '* global changed: `${{ needs.changes.outputs.global }}`'
            echo '* docs only: `${{ needs.changes.outputs.docs_only }}`'
            echo '* core result: `${{ needs.core.result }}`'
            echo '* cli result: `${{ needs.cli.result }}`'
            echo '* app result: `${{ needs.app.result }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a selected CI group failed
        shell: bash
        run: |
          set -euo pipefail
          for result in '${{ needs.core.result }}' '${{ needs.cli.result }}' '${{ needs.app.result }}'; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "A selected CI group finished with result: $result" >&2
                exit 1
                ;;
            esac
          done
